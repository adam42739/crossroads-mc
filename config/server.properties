# ── Base template (per-world) ───────────────────────────────────────────────────
# This file is the BASE for every world. On first provision, provision-worlds.sh
# bakes the manifest settings over it: server-port, gamemode, difficulty,
# hardcore, level-type and level-seed are overwritten per world. Everything below
# is the shared default. Manual edits to a world's baked copy on EBS are preserved.

# ── Connection ────────────────────────────────────────────────────────────────
server-port=25565
online-mode=true

# ── Game settings ─────────────────────────────────────────────────────────────
gamemode=survival
difficulty=normal
hardcore=false
max-players=20
spawn-protection=16
view-distance=10
simulation-distance=10
allow-flight=false
pvp=true

# ── World ─────────────────────────────────────────────────────────────────────
level-name=world
level-type=minecraft\:normal
generate-structures=true

# ── Security ──────────────────────────────────────────────────────────────────
white-list=true
enforce-whitelist=true

# ── RCON ──────────────────────────────────────────────────────────────────────
# rcon.password is baked from the SSM SecureString /crossroads-mc/rcon-password
# on EVERY provision (every boot/swap), so rotating the SSM value and rebooting
# re-applies it. Never commit a real password here; leave it blank.
enable-rcon=true
rcon.port=25575
rcon.password=

# ── Display ───────────────────────────────────────────────────────────────────
motd=Crossroads MC
enable-status=true
